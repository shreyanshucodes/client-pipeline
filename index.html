<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Pipeline Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><i class="fas fa-chart-line"></i> Client Pipeline Tracker</h1>
            <div class="controls">
                <a href="https://github.com/shreyanshucodes/client-pipeline" target="_blank" rel="noopener noreferrer" class="github-btn" title="View Source on GitHub"><i class="fab fa-github"></i> Star on GitHub</a>
                <button id="theme-toggle" title="Toggle Dark/Light Mode"><i class="fas fa-moon"></i></button>
                <button id="export-btn" title="Export to CSV"><i class="fas fa-file-csv"></i> Export CSV</button>
                <button id="add-btn" title="Add Client"><i class="fas fa-plus"></i> Add Client</button>
            </div>
        </div>
        <div class="stats-bar">
            <div class="stat-card">
                <span class="stat-label">Total Leads</span>
                <span class="stat-value" id="stat-leads">10</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Pipeline Value</span>
                <span class="stat-value" id="stat-value">₹8,45,000</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Conversion Rate</span>
                <span class="stat-value" id="stat-conversion">10%</span>
            </div>
        </div>
        <div class="filters">
            <input type="text" id="search-input" placeholder="🔍 Search clients, companies, or notes...">
            <select id="sort-select">
                <option value="date-desc">Sort: Newest First</option>
                <option value="date-asc">Sort: Oldest First</option>
                <option value="val-desc">Sort: Highest Value</option>
                <option value="val-asc">Sort: Lowest Value</option>
            </select>
            <button id="load-sample-btn" class="secondary" title="Restore original 10 demo clients"><i class="fas fa-undo"></i> Reset Demo Data</button>
        </div>
    </header>

    <main class="kanban-board">
        <!-- Columns will be generated by JS -->
    </main>

    <!-- Add/Edit Modal -->
    <div id="client-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Add Client</h2>
            <form id="client-form">
                <input type="hidden" id="client-id">
                <div class="form-group">
                    <label for="client-name">Client Name *</label>
                    <input type="text" id="client-name" required>
                </div>
                <div class="form-group">
                    <label for="client-company">Company</label>
                    <input type="text" id="client-company">
                </div>
                <div class="form-group">
                    <label for="client-value">Value (₹)</label>
                    <input type="number" id="client-value" min="0" step="500">
                </div>
                <div class="form-group">
                    <label for="client-stage">Stage</label>
                    <select id="client-stage">
                        <option value="Lead">Lead</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Meeting Scheduled">Meeting Scheduled</option>
                        <option value="Proposal Sent">Proposal Sent</option>
                        <option value="Negotiating">Negotiating</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="client-notes">Notes</label>
                    <textarea id="client-notes" rows="3"></textarea>
                </div>
                <button type="submit" class="submit-btn">Save Client</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
